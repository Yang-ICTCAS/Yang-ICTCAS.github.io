bio: |
  Xiaodong Yang (杨晓东) is an Associate Researcher at the [Institute of Computing Technology (ICT)](https://www.ict.ac.cn/), Chinese Academy of Sciences, and a Master's supervisor in Computer Application Technology. He is a member of the Ubiquitous Computing Systems Research Center (泛在计算系统研究中心).

  His research focuses on **AI for Science**, with emphasis on digital cell simulation, multimodal large language models, federated learning for healthcare, and intelligent clinical decision support. His work has been published in *Cell Research* (IF 28.2), AAAI, IJCAI, and IEEE Transactions, with **15 Chinese patents**.

  He leads a National Natural Science Foundation of China (NSFC) Youth Project and serves as sub-project leader in the National Key R&D Program on life science foundation models.

  **Prospective students**: I am looking for motivated Master's students and research interns interested in AI for Science and intelligent healthcare. Please reach out by email.

