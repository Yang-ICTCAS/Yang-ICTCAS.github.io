title: Xiaodong Yang
baseURL: 'https://Yang-ICTCAS.github.io/'

defaultContentLanguage: en
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true

enableRobotsTXT: true
summaryLength: 30

paginate: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON

module:
  imports:
    - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-tailwind
    - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-core
    - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-seo

build:
  writeStats: true

markup:
  _merge: deep

imaging:
  resampleFilter: lanczos
  quality: 80
  anchor: smart

taxonomies:
  tag: tags
  category: categories
  publication_type: publication_types
  author: authors

related:
  threshold: 80
  includeNewer: true
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 70
