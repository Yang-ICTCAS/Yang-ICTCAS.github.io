title: Xiaodong Yang
baseURL: 'https://Yang-ICTCAS.github.io/'

defaultContentLanguage: en
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true

enableRobotsTXT: true
enableGitInfo: false
summaryLength: 30
enableEmoji: true

pagination:
  pagerSize: 10

outputs:
  home: [HTML, RSS, headers, redirects, backlinks]
  section: [HTML, RSS]

module:
  imports:
    - path: github.com/HugoBlox/kit/modules/blox
    - path: github.com/HugoBlox/kit/modules/slides

build:
  writeStats: true

markup:
  _merge: deep

imaging:
  resampleFilter: lanczos
  quality: 90
  anchor: smart

taxonomies:
  tag: tags
  category: categories
  publication_type: publication_types
  author: authors

related:
  threshold: 80
  includeNewer: true
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 70
